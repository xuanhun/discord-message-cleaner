<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Discord Message Cleaner</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 14px/1.5 system-ui, sans-serif;
    }
    body {
      width: 270px;
      margin: 0;
      padding: 16px;
      background: Canvas;
      color: CanvasText;
    }
    h1 { margin: 0 0 8px; font-size: 17px; }
    p { margin: 0 0 12px; }
    button {
      min-height: 34px;
      padding: 5px 10px;
      border: 1px solid #3253bd;
      border-radius: 6px;
      background: #3253bd;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #6384f1; outline-offset: 3px; }
  </style>
  <script src="popup.js" defer></script>
</head>
<body>
  <h1 data-message="extensionName"></h1>
  <p id="status" role="status" data-message="checkingTab"></p>
  <button id="open-discord" type="button" data-message="openDiscord" hidden></button>
  <button id="retry" type="button" data-message="retry" hidden></button>
</body>
</html>
